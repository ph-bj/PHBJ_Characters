<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 48 48" width="48" height="48" fill="none">
  <title>Plum Blossom Line Drawing</title>
  <defs>
    <style>
      .plum-petal { stroke: currentColor; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; fill: currentColor; fill-opacity: 0.15; }
      .plum-stamen { stroke: currentColor; stroke-width: 0.9; stroke-linecap: round; }
      .plum-anther { fill: currentColor; }
    </style>
  </defs>
  <!-- 5 Petals -->
  <g class="plum-petals">
    <!-- Petal 1 (Top) -->
    <path class="plum-petal" d="M 0,-2 C -5,-7 -9,-15 0,-20 C 9,-15 5,-7 0,-2 Z" />
    <!-- Petal 2 -->
    <path class="plum-petal" d="M 0,-2 C -5,-7 -9,-15 0,-20 C 9,-15 5,-7 0,-2 Z" transform="rotate(72)" />
    <!-- Petal 3 -->
    <path class="plum-petal" d="M 0,-2 C -5,-7 -9,-15 0,-20 C 9,-15 5,-7 0,-2 Z" transform="rotate(144)" />
    <!-- Petal 4 -->
    <path class="plum-petal" d="M 0,-2 C -5,-7 -9,-15 0,-20 C 9,-15 5,-7 0,-2 Z" transform="rotate(216)" />
    <!-- Petal 5 -->
    <path class="plum-petal" d="M 0,-2 C -5,-7 -9,-15 0,-20 C 9,-15 5,-7 0,-2 Z" transform="rotate(288)" />
  </g>
  <!-- Stamens and Anthers -->
  <g class="plum-stamens">
    <!-- 8 Stamens radiating outward -->
    <g transform="rotate(18)">
      <line class="plum-stamen" x1="0" y1="-2" x2="0" y2="-10" />
      <circle class="plum-anther" cx="0" cy="-11" r="1" />
    </g>
    <g transform="rotate(63)">
      <line class="plum-stamen" x1="0" y1="-2" x2="0" y2="-10" />
      <circle class="plum-anther" cx="0" cy="-11" r="1" />
    </g>
    <g transform="rotate(108)">
      <line class="plum-stamen" x1="0" y1="-2" x2="0" y2="-10" />
      <circle class="plum-anther" cx="0" cy="-11" r="1" />
    </g>
    <g transform="rotate(153)">
      <line class="plum-stamen" x1="0" y1="-2" x2="0" y2="-10" />
      <circle class="plum-anther" cx="0" cy="-11" r="1" />
    </g>
    <g transform="rotate(198)">
      <line class="plum-stamen" x1="0" y1="-2" x2="0" y2="-10" />
      <circle class="plum-anther" cx="0" cy="-11" r="1" />
    </g>
    <g transform="rotate(243)">
      <line class="plum-stamen" x1="0" y1="-2" x2="0" y2="-10" />
      <circle class="plum-anther" cx="0" cy="-11" r="1" />
    </g>
    <g transform="rotate(288)">
      <line class="plum-stamen" x1="0" y1="-2" x2="0" y2="-10" />
      <circle class="plum-anther" cx="0" cy="-11" r="1" />
    </g>
    <g transform="rotate(333)">
      <line class="plum-stamen" x1="0" y1="-2" x2="0" y2="-10" />
      <circle class="plum-anther" cx="0" cy="-11" r="1" />
    </g>
    <!-- Pistil center dot -->
    <circle class="plum-anther" cx="0" cy="0" r="1.8" />
  </g>
</svg>
